{% load static %}
{% load bootstrap5 %} <!-- Load bootstrap5 tags if needed for other purposes -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        My Website
      {% endblock %}
    </title>

    <!-- Include Bootstrap via CDN instead of template tags -->
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    {% comment %} <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa8houQo12P1N+0PI5Jktsqx7IL+q6UIl0ms2GJ95rW1uCf6B/7prZ7W5zD" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeo6miEux5ytBTO5FJY7mA1b0JCgBxE/fpF8b61za7Q5C/kM" crossorigin="anonymous"></script> {% endcomment %}
  </head>
  <body>
    <!-- Navbar -->
    {% block navbar %}
      {% include 'navbar.html' %}
    {% endblock %}

    <!-- Content of the page -->
    <div class="container-fluid">
      {% block content %}
      {% endblock %}
    </div>

    <!-- Footer -->
    {% block footer %}
      {% include 'footer.html' %}
    {% endblock %}
  </body>
</html>

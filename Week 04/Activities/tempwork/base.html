<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
    
    <!-- Include Bootstrap CSS once in the base template -->
    {% load bootstrap5 %}
    {% bootstrap5_css %}
</head>
<body>
    <!-- Navbar -->
    {% block navbar %}
    {% include "navbar.html" %}
    {% endblock %}

    <!-- Content of the page -->
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    {% block footer %}
    {% include "footer.html" %}
    {% endblock %}

    <!-- Include Bootstrap JavaScript once in the base template -->
    {% bootstrap5_javascript %}
</body>
</html>

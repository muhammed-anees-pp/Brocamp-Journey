<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
</head>
<body>
    <h1>Movie List</h1>
    <ul>
        {% for movie in movies %}
        <li>
            <strong>{{ movie.title }}</strong> ({{ movie.year }})  
            <p>{{ movie.description }}</p>
        </li>
        {% empty %}
        <li>No movies available.</li>
        {% endfor %}
    </ul>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
    </head>

    <body>
        <h4>Table</h4>
        <table border="1px"><!--Defines the start table-->
            <thead><!--For table head-->
                <tr><!--Table row-->
                    <th>No</th><!--Table header-->
                    <th>Business</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody> <!-- For table body-->
                <tr>
                    <td>01</td> <!--Table data-->
                    <td>Restaurant</td>
                    <td>Traditional</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Swiggy</td>
                    <td>Startup</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">This is foot</td>
                    <td>Test</td>
                </tr>
            </tfoot>
        </table> <!--End of a table-->
    </body>
</html>

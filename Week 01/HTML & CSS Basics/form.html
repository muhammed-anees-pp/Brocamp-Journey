<!DOCTYPE html>
<html>
    <head>
        <title>Form Example</title>
    </head>
    <body>
        <h2>Form example</h2>
        <form>
            
            <!-- Basic Input Fields -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="100"><br><br>
            
            <label for="date">Date of Birth:</label>
            <input type="date" id="date" name="dateofBirth"><br><br>
            
            <!-- Radio Buttons and Checkboxes -->
            <label for="gender">Gender</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>


            <fieldset>
                <legend>Hobbies</legend>
                <input type="checkbox" id="reading" name="hobbies" value="reading">
                <label for="reading">Reading</label><br>
                <input type="checkbox" id="traveling" name="hobbies" value="traveling">
                <label for="traveling">Traveling</label>
            </fieldset><br>

            <!-- Select and Datalist -->
            <label for="country">Country:</label>
            <select name="country" id="country">
                <optgroup label="North America">
                    <option value="usa">United States</option>
                    <option value="canada">Canada</option>
                </optgroup>
                <optgroup label="Europe">
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                </optgroup>
            </select><br><br>

            <label for="city">City (start typing):</label>
            <input list="cities" id="city" name="city">
            <datalist id="cities">
                <option value="New York">
                <option value="Los Angeles">
                <option value="Berlin">
                <option value="Paris">
            </datalist><br><br>

            <!-- File Upload -->
            <label for="profilePic">Upload Profile Picture:</label>
            <input type="file" id="profilePic" name="profilePic"><br><br>

            <!-- Range and Color Inputs -->
            <label for="experience">Experience (0-10)</label>
            <input type="range" id="experience" name="experience" min="0" max="100"><br><br>

            <label for="favcolor">Favorite Color:</label>
            <input type="color" id="favcolor" name="favcolor"><br><br>

            <!-- Progress and Meter -->
            <label for="progress">Form Completion Progress:</label>
            <progress id="progress" value="20" max="100"></progress><br><br>

            <label for="satisfaction">Satisfaction Level:</label>
            <meter id="satisfaction" min="0" max="10" value="7">7 out of 10</meter><br><br>

            <!--Text area-->
            <label for="comments">Comments:</label><br>
            <textarea name="comments" id="comments" rows="5" cols="50"></textarea><br><br>

            <!--Output-->
            <label for="result">Result:</label>
            <output id="result">Pending..</output><br><br>

            <!--Buttons-->
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            <button type="button" onclick="alert('You are clicked the custom button')">Click here</button>

        </form>
    </body>
</html>
